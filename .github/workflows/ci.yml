name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm-lock.yaml is gitignored in this repo, so CI resolves from package.json ranges.
      - run: pnpm install

      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/load-test.js
