apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: livescope
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/livescope/livescope
    path: infra/helm/livescope
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: livescope
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
